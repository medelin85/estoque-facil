name: Testes do Estoque Facil
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q estoque_facil run_local.py
      - run: python -m pytest --cov=estoque_facil --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml
