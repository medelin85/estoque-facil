<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title|default('Estoque Fácil') }} — Estoque Fácil</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body><a class="skip" href="#main">Pular para o conteúdo</a><header><div><strong>▣ Estoque Fácil</strong><p>Controle de produtos e validades</p></div>{% if g.user %}<form action="{{ url_for('logout') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Sair</button></form>{% endif %}</header>
