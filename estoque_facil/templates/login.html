{% extends 'base.html' %}{% block content %}<h1>Entrar</h1><p>Acesso restrito ao responsável pelo estoque.</p>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="login">Usuário</label><input id="login" name="login" maxlength="100" autocomplete="username" required><label for="password">Senha</label><input id="password" name="password" type="password" maxlength="256" autocomplete="current-password" required><button class="primary">Entrar</button></form>{% if config.DEMO_MODE %}<hr><h2>Conheça o sistema</h2><p>Acesse com uma conta compartilhada para testar com dados fictícios.</p><form action="{{ url_for('demo_login') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="primary">Entrar na demonstração</button></form>{% endif %}{% endblock %}
